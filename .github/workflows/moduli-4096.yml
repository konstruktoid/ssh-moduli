---
name: Moduli 4096 bits
on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * */5"
permissions:
  contents: read
jobs:
  Generate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Set current date as env variable
        run: echo CURRENT_DATE=$(date +'%Y%m%d') >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Install openssh-client
        run: |
          sudo apt-get install --assume-yes --no-install-recommends --update openssh-client

      - name: Generate 4096 bits moduli file
        run: |
          set -eu -o pipefail
          mkdir -p /tmp/moduli
          time ssh-keygen -M generate -O bits=4096 /tmp/moduli/moduli.4096-candidates
          time ssh-keygen -M screen -f /tmp/moduli/moduli.4096-candidates /tmp/moduli/moduli.4096

      - name: Upload moduli artifact
        if: ${{ github.ref_name == 'main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moduli.4096
          path: /tmp/moduli/moduli.4096
